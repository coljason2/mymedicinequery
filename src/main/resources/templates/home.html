<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:include="components/header :: header">
    <title>福誠查藥系統</title>
</head>
<nav class="navbar navbar-custom navbar-fixed-top" th:include="components/nav :: nav"></nav>
<body>

<div class="workspace-container">
    <!-- 頂部常駐雙欄整合查詢列 -->
    <div class="search-panel">
        <div class="search-grid">
            <!-- 左欄：藥名 / 健保碼查詢 -->
            <form action="/query" method="POST" class="ajax-query-form" style="margin: 0;">
                <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>
                <label for="home-querystring" class="search-field-label">
                    藥品名稱 / 健保代碼查詢
                </label>
                <div class="search-flex-row">
                    <div class="search-input-wrap">
                        <input type="text" id="home-querystring" name="querystring" class="form-control search-input-lg"
                               placeholder="輸入藥名或 10 碼健保碼（例如：安咳、AC33052100）" required autofocus>
                    </div>
                    <button type="submit" class="btn btn-primary search-btn-lg">
                        <span class="glyphicon glyphicon-search"></span> 查詢
                    </button>
                </div>
            </form>

            <!-- 右欄：藥品公司多選篩選 -->
            <form action="/query/list" method="POST" class="ajax-query-form" style="margin: 0;">
                <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>
                <label for="home-company-select" class="search-field-label">
                    依藥品公司批次篩選
                </label>
                <div class="search-flex-row">
                    <div class="search-input-wrap">
                        <select id="home-company-select" class="form-control company-select" name="querystring" multiple="multiple" style="width: 100%;">
                            <option th:each="item:${medCompanys}" th:value="${item}" th:text="${item}"></option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-default search-btn-lg">
                        篩選公司
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- 下方結果顯示區 (查詢後由 AJAX 直接替換此區塊) -->
    <div id="main-content">
        <div class="clean-card" style="text-align: center; padding: 48px 24px;">
            <div style="font-size: 20px; font-weight: 700; color: var(--text-main); margin-bottom: 10px;">
                請於上方輸入條件開始查詢
            </div>
            <p class="text-muted" style="font-size: 16px; max-width: 640px; margin: 0 auto; line-height: 1.7;">
                支援藥品中英文名稱、10 碼健保代碼直接搜尋，或由右側選單勾選多間合作藥廠查詢即時庫存與核定價。
            </p>
        </div>
    </div>
</div>

<footer class="footer" th:include="components/footer :: footer"></footer>

</body>
</html>
