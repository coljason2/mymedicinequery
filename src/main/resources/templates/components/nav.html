<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<nav class="navbar navbar-custom navbar-fixed-top" th:fragment="nav">
    <div class="container-fluid">
        <!-- Brand and toggle get grouped for better mobile display -->
        <div class="navbar-header">
            <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#nav-collapse-section" aria-expanded="false">
                <span class="sr-only">Toggle navigation</span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
            </button>
            <a class="navbar-brand" href="/home">福誠查藥系統</a>
        </div>

        <!-- Collect the nav links, forms, and other content for toggling -->
        <div class="collapse navbar-collapse" id="nav-collapse-section">
            <form class="navbar-form navbar-left" action="/query" method="POST">
                <div class="input-group">
                    <input type="text" name="querystring" placeholder="輸入要查詢(藥名/公司)" class="form-control">
                    <span class="input-group-btn">
                        <button type="submit" class="btn btn-success">查詢</button>
                    </span>
                    <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>
                </div>
            </form>

            <ul class="nav navbar-nav">
                <li><a href="javascript:void(0)" style="cursor:default;">藥品公司查詢</a></li>
            </ul>
            <form class="navbar-form navbar-left" action="/query/list" method="POST">
                <div class="input-group">
                    <select class="custom-select" name="querystring" multiple="multiple" style="width:200px;">
                        <option th:each="item:${medCompanys}" th:value="${item}" th:text="${item}"></option>
                    </select>
                    <span class="input-group-btn">
                        <button type="submit" class="btn btn-success">查詢</button>
                    </span>
                    <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>
                </div>
            </form>

            <form class="navbar-form navbar-right" id="logout" action="/logout" method="post">
                <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>
                <button type="submit" class="btn btn-info">登出</button>
            </form>
        </div><!-- /.navbar-collapse -->

        <!-- Loading Mask Element -->
        <div id="loading-mask">
            <div class="spinner"></div>
            <div class="loading-text">資料爬取與分析中，請稍候...</div>
        </div>

        <script>
            $(document).ready(function () {
                $('.custom-select').select2({
                    tags: true,
                    tokenSeparators: [',', ' ']
                });

                // 當送出查詢表單時，使用 AJAX 非同步發送
                $('form').on('submit', function(e) {
                    // 排除登出按鈕
                    if ($(this).attr('id') !== 'logout') {
                        e.preventDefault(); // 阻止傳統跳頁
                        var form = $(this);
                        var url = form.attr('action');
                        var method = form.attr('method');
                        var data = form.serialize();

                        $('#loading-mask').css('display', 'flex'); // 顯示 Loading 遮罩

                        $.ajax({
                            type: method,
                            url: url,
                            data: data,
                            success: function(response) {
                                // 將回傳的結果片段覆蓋原本的主內容區塊
                                $('#main-content').replaceWith(response);
                                $('#loading-mask').hide(); // 隱藏遮罩
                            },
                            error: function() {
                                alert("查詢發生錯誤，請重試！");
                                $('#loading-mask').hide(); // 隱藏遮罩
                            }
                        });
                    }
                });
            });
        </script>
    </div>
</nav>
