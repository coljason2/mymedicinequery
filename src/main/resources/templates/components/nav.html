<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<nav class="navbar navbar-custom navbar-fixed-top" th:fragment="nav">
    <div class="container-fluid">
        <div class="navbar-header">
            <button type="button" class="navbar-toggle collapsed" data-toggle="collapse"
                data-target="#nav-collapse-section" aria-expanded="false">
                <span class="sr-only">Toggle navigation</span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
            </button>
            <a class="navbar-brand" href="/home">福誠查藥系統</a>
        </div>

        <div class="collapse navbar-collapse" id="nav-collapse-section">
            <ul class="nav navbar-nav">
                <li><a href="/home"><span class="glyphicon glyphicon-search"></span> 藥品查詢</a></li>
                <li><a href="/download"><span class="glyphicon glyphicon-phone"></span> 下載 APP</a></li>
                <li th:if="${#httpServletRequest != null and #httpServletRequest.isUserInRole('ADMIN')}">
                    <a href="/admin/version"><span class="glyphicon glyphicon-cog"></span> 版本管理</a>
                </li>
            </ul>

            <ul class="nav navbar-nav navbar-right" style="margin-right: 0;">
                <li>
                    <button type="button" class="btn nav-action-btn" onclick="toggleTheme()" title="切換亮色 / 暗色模式" style="margin-right: 10px;">
                        <span class="glyphicon glyphicon-adjust"></span> <span class="theme-toggle-label">切換暗色</span>
                    </button>
                </li>
                <li>
                    <form id="logout" action="/logout" method="post" style="display: inline-block; margin: 0;">
                        <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}" />
                        <button type="submit" class="btn nav-action-btn">
                            <span class="glyphicon glyphicon-log-out"></span> 登出
                        </button>
                    </form>
                </li>
            </ul>
        </div>

        <!-- 載入遮罩 -->
        <div id="loading-mask">
            <div class="spinner"></div>
            <div class="loading-text">資料查詢中，請稍候...</div>
        </div>

        <script>
            $(document).ready(function () {
                // 初始化頁面上所有的公司多選下拉選單
                if ($('.company-select').length > 0) {
                    $('.company-select').select2({
                        placeholder: "選擇或輸入藥品公司名稱（可複選）",
                        allowClear: true,
                        tags: true,
                        tokenSeparators: [',', ' '],
                        width: '100%'
                    });
                }

                // 攔截查詢表單 (.ajax-query-form)，使用 AJAX 更新下方 #main-content 結果區
                $(document).on('submit', '.ajax-query-form', function (e) {
                    e.preventDefault();
                    if ($('#nav-collapse-section').hasClass('in')) {
                        $('#nav-collapse-section').collapse('hide');
                    }
                    var form = $(this);
                    var url = form.attr('action');
                    var method = form.attr('method');
                    var data = form.serialize();

                    $('#loading-mask').css('display', 'flex');

                    $.ajax({
                        type: method,
                        url: url,
                        data: data,
                        success: function (response) {
                            $('#main-content').replaceWith(response);
                            $('#loading-mask').hide();
                        },
                        error: function (xhr) {
                            if (xhr.status === 401) {
                                alert("登入已過期，請重新登入！");
                                window.location.href = '/login';
                            } else {
                                alert("查詢發生錯誤，請重試！");
                            }
                            $('#loading-mask').hide();
                        }
                    });
                });
            });
        </script>
    </div>
</nav>
</html>
