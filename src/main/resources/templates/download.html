<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:include="components/header :: header">
    <title>福誠查藥 APP - 行動版下載</title>
</head>
<nav class="navbar navbar-custom navbar-fixed-top" th:include="components/nav :: nav"></nav>
<body>

<div class="workspace-container" style="max-width: 760px;">
    <div class="clean-card">
        <div style="border-bottom: 1px solid var(--border-subtle); padding-bottom: 18px; margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;">
            <div>
                <h3 style="margin: 0 0 6px 0; font-weight: 700; font-size: 22px;">
                    福誠查藥 Android 行動版
                </h3>
                <p class="text-muted" style="margin: 0; font-size: 16px;">
                    支援手機查詢大盤庫存、健保核定價與食藥署仿單詳細資訊
                </p>
            </div>
            <div style="font-size: 15px; color: var(--text-secondary); background-color: var(--bg-subtle); padding: 8px 14px; border-radius: 6px; border: 1px solid var(--border-subtle);">
                版本：<strong style="color: var(--primary-color);" th:text="'v' + ${config.versionName}">v3.6</strong>
                <span style="margin: 0 6px; color: var(--border-color);">|</span>
                代碼：<strong th:text="${config.versionCode}">4</strong>
            </div>
        </div>

        <div class="row" style="align-items: center;">
            <!-- 左側 QR Code -->
            <div class="col-sm-5 text-center" style="margin-bottom: 20px;">
                <div style="display: inline-block; padding: 14px; background: #ffffff; border: 1px solid var(--border-color); border-radius: 8px;">
                    <div id="qrcode-box" style="width: 200px; height: 200px; margin: 0 auto; display: flex; align-items: center; justify-content: center;">
                        <img id="qrcode-img" th:src="'https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=5&data=' + ${config.downloadUrl}" 
                             alt="下載 QR Code" width="200" height="200" style="display: block;" />
                    </div>
                </div>
                <div class="text-muted" style="margin-top: 10px; font-size: 15px;">
                    手機相機掃描下載
                </div>
            </div>

            <!-- 右側下載與安裝說明 -->
            <div class="col-sm-7">
                <div style="margin-bottom: 22px;">
                    <a th:href="${config.downloadUrl}" target="_blank" class="btn btn-primary btn-block"
                       style="height: 48px; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px;">
                        <span class="glyphicon glyphicon-download-alt"></span> 下載 Android APK 安裝檔
                    </a>
                    <div style="margin-top: 8px; font-size: 14px;" class="text-muted">
                        若導向 Google 雲端硬碟，請點選「仍要下載」取得檔案。
                    </div>
                </div>

                <div th:if="${config.updateLog != null and !#strings.isEmpty(config.updateLog)}" style="margin-bottom: 20px;">
                    <div style="font-weight: 700; font-size: 16px; margin-bottom: 8px; color: var(--text-main);">
                        版本更新內容
                    </div>
                    <div style="background-color: var(--bg-subtle); border: 1px solid var(--border-subtle); border-radius: 6px; padding: 14px; font-size: 15px; line-height: 1.6; white-space: pre-line; color: var(--text-secondary);"
                         th:text="${config.updateLog}">
                    </div>
                </div>

                <div style="background-color: var(--bg-subtle); border: 1px solid var(--border-subtle); border-radius: 6px; padding: 14px 18px; font-size: 15px; line-height: 1.7; color: var(--text-secondary);">
                    <div style="font-weight: 700; margin-bottom: 6px; color: var(--text-main); font-size: 16px;">安裝步驟</div>
                    <ol style="margin-bottom: 0; padding-left: 20px;">
                        <li>下載完成後，於手機通知列或「下載」資料夾點選 <code>.apk</code> 檔案。</li>
                        <li>若出現安全性提示，請依指示允許瀏覽器「安裝未知應用程式」即可完成。</li>
                    </ol>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="footer" th:include="components/footer :: footer"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    $(document).ready(function() {
        var downloadUrl = /*[[${config.downloadUrl}]]*/ '';
        if (typeof QRCode !== 'undefined' && downloadUrl) {
            var box = document.getElementById('qrcode-box');
            box.innerHTML = '';
            new QRCode(box, {
                text: downloadUrl,
                width: 200,
                height: 200,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.M
            });
        }
    });
    /*]]>*/
</script>
</body>
</html>
