server:
  port: 8080
  maxHttpHeaderSize: 65536
  maxPostSize: 4194304
  tomcat:
    threads:
      max: 20
spring:
  main:
    lazy-initialization: true
  jmx:
    enabled: false
  application:
    name: NewMedicineQuery
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=300,expireAfterWrite=45m
  thymeleaf:
    cache: true
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8
    mode: HTML
    servlet:
      content-type: text/html
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  profiles:
    active: prod
  devtools:
    restart:
      enabled: false
  servlet:
    multipart:
      max-request-size: 50MB
      max-file-size: 50MB

logging:
  level:
    root: INFO
  file:
    name: "${spring.application.name}.log"
    path: "."
    max-size: 10MB
    max-history: 3
    total-size-cap: 30MB

management:
  health:
    redis:
      enabled: false
    rabbit:
      enabled: false
  endpoints:
    web:
      exposure:
        include: "health,info"
    jmx:
      enabled: false
  endpoint:
    health:
      show-details: always
    shutdown:
      enabled: false
    jolokia:
      enabled: false
